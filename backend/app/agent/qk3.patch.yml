- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      qk3:
        displayName: QK3 LLM
        apiKeyEnv: QK3_LLM_KEY
        api: openai-completions
        baseURL: !!js process.env.QK3_LLM_BASE_URL
        models:
          - id: !!js process.env.QK3_LLM_MODEL
            name: QK3
            contextWindow: !!js Number(process.env.QK3_LLM_CONTEXT || 131072)
            # Qwen3 thinks unless the request says otherwise. `high` sends enable_thinking true, `off` sends false
            # (app.agent.runtime.reasoning_effort, the admin switch "Suy nghĩ trước khi trả lời").
            reasoningEfforts:
              high: high
            compat:
              thinkingFormat: qwen-chat-template
- insert:
    - id: mcp-qk3
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: qk3
        transport: stdio
        command: !!js process.env.QK3_PYTHON
        args: ['-m', 'app.rag.mcp_server']
        cwd: !!js process.env.QK3_BACKEND
        failOnStartupError: true
        env:
          QK3_SCOPE_TOKEN: !!js process.env.QK3_SCOPE_TOKEN
          JWT_SECRET: !!js process.env.JWT_SECRET
          SETTINGS_KEY: !!js process.env.SETTINGS_KEY
          DATABASE_URL: !!js process.env.DATABASE_URL
          DATA_DIR: !!js process.env.DATA_DIR
          UPLOAD_DIR: !!js process.env.UPLOAD_DIR
          TEMP_DIR: !!js process.env.TEMP_DIR
          APP_ENV: !!js process.env.APP_ENV
          QDRANT_URL: !!js process.env.QDRANT_URL
          QDRANT_API_KEY: !!js process.env.QDRANT_API_KEY
          QDRANT_COLLECTION: !!js process.env.QDRANT_COLLECTION
          QK3_EMBEDDER: !!js process.env.QK3_EMBEDDER
          QK3_EMBEDDER_DIM: !!js process.env.QK3_EMBEDDER_DIM
          PYTHONPATH: !!js process.env.QK3_BACKEND
