# Hồ sơ (profile patch) của agent QK3 đặt lên trên profile `sdk` của DeepSeek Harness (deepseek-harness-sdk==0.2.1rc2, bản thử nghiệm).
# Mục tiêu: mô hình chỉ có các công cụ tra cứu văn bản của mình (MCP, app/rag/mcp_server.py). Đã tắt: shell, tệp, subagent, workflow/ptc,
# web (đường ra Internet), goal, kỹ năng, telemetry, tài khoản DeepSeek, truy cập từ xa, thư mục làm việc, chế độ lập kế hoạch.
# Danh tính người hỏi nằm trong QK3_SCOPE_TOKEN của môi trường tiến trình công cụ (xem app/rag/identity.py), không do mô hình quyết định.
# Môi trường do app/agent/runtime.py đặt khi khởi động từng runtime (một runtime cho mỗi cuộc trò chuyện): QK3_LLM_BASE_URL, QK3_LLM_MODEL,
# QK3_LLM_KEY, QK3_LLM_CONTEXT, QK3_PYTHON, QK3_BACKEND, QK3_SCOPE_TOKEN và các biến chuyển tiếp cho tiến trình công cụ (xem FORWARDED).
# Không ghi cứng địa chỉ LLM ở đây: nó do quản trị viên cấu hình trong Quản trị → Hệ thống.
