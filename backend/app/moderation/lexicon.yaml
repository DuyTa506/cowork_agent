# Từ điển kiểm duyệt đầu vào. Mỗi mục: t = cụm từ, c = nhóm, s = mức (nhe | nang), f = true nếu so khớp được khi người dùng gõ không dấu.
# f: false bắt buộc có dấu đúng, để không nhầm với từ bình thường ("các" ≠ "cặc", "lon bia" ≠ "lồn", "đít" ≠ "địt").
# Nhóm: tuc (chửi thề, thô tục) | xuc_pham (xúc phạm cá nhân) | ky_thi (kỳ thị vùng miền, dân tộc, giới, xu hướng) | de_doa (đe dọa cá nhân).
# Cố ý KHÔNG đưa từ ngữ quân sự thông thường (tiêu diệt, tấn công, bắn, giết giặc...) hay từ nhiều nghĩa (mọi, chó, cc).
