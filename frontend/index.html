<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1f44" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Hệ thống AI Quân khu 3 (Hỗ trợ xử lý văn bản)" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <title>Hệ thống AI Quân khu 3 (Hỗ trợ xử lý văn bản)</title>
    <script>
      /* Apply the saved (or OS) theme before first paint so there is no flash. Mirrors src/lib/theme.ts. */
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('qk3.theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
