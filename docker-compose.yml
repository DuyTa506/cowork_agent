name: qk3-ai-document

# Settings shared by the API and the worker. Model endpoints (LLM, embedding, rerank, OCR) are only defaults here: an
# administrator changes them at run time in Quản trị → Hệ thống.
x-backend-env: &backend-env
  APP_NAME: "Hệ thống AI xử lý văn bản - Quân khu 3"
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qk3app}:${POSTGRES_PASSWORD:-ChangeDbPass_2026}@db:5432/${POSTGRES_DB:-qk3docs}
  JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_SECRET_BEFORE_DEPLOYMENT_64_CHARACTERS_MINIMUM}
  SETTINGS_KEY: ${SETTINGS_KEY:-}
  DATA_DIR: /data
  UPLOAD_DIR: /data/uploads   # only read by `python -m app.storage.migrate` when upgrading from local originals
  TEMP_DIR: /data/tmp
  OBJECT_STORE: s3
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  S3_BUCKET: ${S3_BUCKET:-qk3-documents}
  S3_SECURE: "false"
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-20}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-ChangeQdrantKey_2026}
  QK3_LLM_BASE_URL: ${QK3_LLM_BASE_URL:-}
  QK3_LLM_MODEL: ${QK3_LLM_MODEL:-}
  QK3_LLM_KEY: ${QK3_LLM_KEY:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-}
  EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:-}
  RERANK_BASE_URL: ${RERANK_BASE_URL:-}
  RERANK_MODEL: ${RERANK_MODEL:-}
  OCR_BASE_URL: ${OCR_BASE_URL:-}
  OCR_MODEL: ${OCR_MODEL:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qk3docs}
      POSTGRES_USER: ${POSTGRES_USER:-qk3app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeDbPass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qk3app} -d ${POSTGRES_DB:-qk3docs}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [qk3net]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-ChangeQdrantKey_2026}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [qk3net]

  # Original files (documents, chat attachments). S3-compatible; the bucket is created by the application on first use.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"   # admin console, this machine only
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [qk3net]

  api:
    image: qk3-ai-document-api:0.2.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Quản trị hệ thống}
      ADMIN_UNIT_ID: ${ADMIN_UNIT_ID:-btl}
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [qk3net]

  # Parses, extracts metadata and indexes uploaded documents. Same image as the API; scale with `--scale worker=N`.
  worker:
    image: qk3-ai-document-api:0.2.0
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
    volumes:
      - app_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [qk3net]

  web:
    image: qk3-ai-document-web:0.1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [qk3net]

volumes:
  postgres_data:
  app_data:
  qdrant_data:
  minio_data:

networks:
  qk3net:
    driver: bridge
